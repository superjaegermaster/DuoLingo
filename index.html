  <div class="app-shell">
    <aside class="sidebar" aria-label="Navigation principale">
      <button class="brand" data-nav="learn" aria-label="Minilingo, accueil">
        <span class="brand-mark" data-icon="book"></span>
        <span class="brand-copy"><strong>minilingo</strong><small>L’anglais en s’amusant</small></span>
      </button>

      <p class="sidebar-label">MON COURS</p>
      <nav class="side-nav">
        <button class="nav-item active" data-nav="learn"><span data-icon="home"></span>Apprendre</button>
        <button class="nav-item" data-nav="review"><span data-icon="repeat"></span>Réviser</button>
        <button class="nav-item" data-nav="badges"><span data-icon="award"></span>Mes badges</button>
      </nav>

      <div class="sidebar-goal">
        <div class="sidebar-goal-heading"><span data-icon="target"></span><strong>Objectif du jour</strong></div>
        <div class="goal-track"><span id="sidebar-goal-fill"></span></div>
        <p><span id="sidebar-goal-text">0 / 20 XP</span><span id="sidebar-goal-percent">0 %</span></p>
      </div>

      <div class="sidebar-bottom">
        <div class="encouragement"><span data-icon="sparkles"></span><p>Un petit effort chaque jour, c’est déjà beaucoup !</p></div>
        <button class="parent-button" data-action="settings"><span data-icon="settings"></span>Espace parents</button>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <button class="mobile-brand" data-nav="learn" aria-label="Minilingo, accueil"><span class="brand-mark" data-icon="book"></span><strong>minilingo</strong></button>
        <div class="language-pill"><span class="language-flag">FR</span><span>Je découvre l’anglais</span><span class="language-level">Niveau 1</span></div>
        <div class="topbar-stats">
          <div class="stat-pill streak-pill" title="Jours d’affilée"><span data-icon="flame"></span><strong id="top-streak">0</strong></div>
          <div class="stat-pill xp-pill" title="Points d’expérience"><span data-icon="zap"></span><strong id="top-xp">0</strong></div>
          <button class="profile-button" data-action="settings" aria-label="Ouvrir l’espace parents"><span class="avatar" id="top-avatar">C</span><span class="profile-copy"><strong id="top-name">Championne</strong><small>Petite exploratrice</small></span><span data-icon="settings"></span></button>
        </div>
      </header>

      <main id="main-content" tabindex="-1">
        <div class="loading-state"><span class="loading-orbit"></span><p>On prépare ton aventure…</p></div>
      </main>
    </div>

    <nav class="mobile-nav" aria-label="Navigation mobile">
      <button class="active" data-nav="learn"><span data-icon="home"></span><small>Apprendre</small></button>
      <button data-nav="review"><span data-icon="repeat"></span><small>Réviser</small></button>
      <button data-nav="badges"><span data-icon="award"></span><small>Badges</small></button>
      <button data-action="settings"><span data-icon="settings"></span><small>Parents</small></button>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"><span class="toast-icon" data-icon="check"></span><span id="toast-text"></span></div>
  <dialog class="modal" id="modal" aria-labelledby="modal-title"><div class="modal-surface"><button class="modal-close" data-action="close-modal" aria-label="Fermer"><span data-icon="x"></span></button><div id="modal-content"></div></div></dialog>
